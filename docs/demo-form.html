<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Software Engineering Intern — Application</title>
<style>
  :root { --ink:#1c1f26; --muted:#6b7280; --line:#d9dce1; --brand:#2f5fd9; --bg:#f6f7f9; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif; }
  .top { background:#101319; color:#fff; padding:22px 40px; }
  .top .co { font-weight:700; letter-spacing:.02em; font-size:15px; color:#9fb3ff; }
  .top h1 { margin:6px 0 4px; font-size:22px; }
  .top .meta { color:#a3a9b5; font-size:13px; }
  .wrap { max-width:640px; margin:0 auto; padding:32px 24px 60px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:28px 30px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .card + .card { margin-top:18px; }
  .card h2 { font-size:15px; margin:0 0 18px; padding-bottom:10px; border-bottom:1px solid var(--line); }
  .field { margin-bottom:16px; }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
  label .req { color:#d9483a; }
  input, select, textarea { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:6px; font:inherit; font-size:14px; background:#fff; color:var(--ink); }
  textarea { min-height:74px; resize:vertical; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .hint { color:var(--muted); font-size:12px; margin-top:4px; }
  .actions { display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
  button { font:inherit; font-size:14px; padding:10px 18px; border-radius:6px; cursor:pointer; }
  .save { background:#fff; border:1px solid var(--line); color:var(--ink); }
  .submit { background:var(--brand); border:1px solid var(--brand); color:#fff; font-weight:600; }
</style>
</head>
<body>
  <div class="top">
    <div class="co">NORTHFIELD ROBOTICS</div>
    <h1>Software Engineering Intern — Summer 2027</h1>
    <div class="meta">Mountain View, CA · Applying takes about 5 minutes</div>
  </div>
  <div class="wrap">
    <div class="card">
      <h2>Contact information</h2>
      <div class="row2">
        <div class="field"><label>Full name <span class="req">*</span></label><input id="name" type="text"></div>
        <div class="field"><label>Email <span class="req">*</span></label><input id="email" type="email"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Phone</label><input id="phone" type="tel"></div>
        <div class="field"><label>Location</label><input id="location" type="text" placeholder="City, State"></div>
      </div>
      <div class="field"><label>LinkedIn / portfolio URL</label><input id="links" type="text" placeholder="https://"></div>
    </div>

    <div class="card">
      <h2>Education</h2>
      <div class="row2">
        <div class="field"><label>School <span class="req">*</span></label><input id="school" type="text"></div>
        <div class="field"><label>Expected graduation</label><input id="grad" type="text" placeholder="Month Year"></div>
      </div>
    </div>

    <div class="card">
      <h2>Application questions</h2>
      <div class="field">
        <label>Are you legally authorized to work in the U.S. without sponsorship? <span class="req">*</span></label>
        <select id="auth"><option value="">Select one</option><option>Yes</option><option>No</option></select>
      </div>
      <div class="field"><label>When can you start? <span class="req">*</span></label><input id="start" type="text"></div>
      <div class="field">
        <label>Why are you interested in this role? <span class="req">*</span></label>
        <textarea id="why" placeholder="2-3 sentences"></textarea>
        <div class="hint">Pulled from your resume and profile when you don't write one yourself.</div>
      </div>
    </div>

    <div class="actions">
      <button class="save" type="button">Save draft</button>
      <button class="submit" type="button" id="submitBtn">Submit Application</button>
    </div>
  </div>
</body>
</html>
